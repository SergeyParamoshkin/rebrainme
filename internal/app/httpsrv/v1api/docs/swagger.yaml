basePath: /v1
definitions:
  domain.Ticket:
    properties:
      createdAt:
        type: string
      id:
        type: string
      key:
        type: string
      queue:
        type: string
      summary:
        type: string
      type:
        type: string
      updatedAt:
        type: string
    type: object
  fwerr.Code:
    enum:
    - INTERNAL_ERROR
    - AUTH_ERROR
    - FORBIDDEN
    - DB_ERROR
    - BAD_REQUEST
    - NOT_FOUND
    type: string
    x-enum-varnames:
    - CodeInternalError
    - CodeAuthError
    - CodeForbidden
    - CodeDBError
    - CodeBadRequest
    - CodeNotFound
  httpresp.ErrResponse:
    properties:
      code:
        $ref: '#/definitions/fwerr.Code'
      message:
        type: string
    type: object
  v1api.infoResponse:
    properties:
      commit_sha:
        type: string
      version:
        type: string
    type: object
  v1api.ticketGetResponse:
    properties:
      code:
        type: string
      data:
        $ref: '#/definitions/v1api.ticketGetResponseData'
    type: object
  v1api.ticketGetResponseData:
    properties:
      item:
        $ref: '#/definitions/domain.Ticket'
      total:
        type: integer
    type: object
  v1api.ticketListRequest:
    properties:
      filter:
        $ref: '#/definitions/v1api.ticketListRequestFilter'
      offset:
        type: integer
      size:
        type: integer
    type: object
  v1api.ticketListRequestFilter:
    properties:
      key:
        type: string
    type: object
  v1api.ticketListResponse:
    properties:
      code:
        type: string
      data:
        $ref: '#/definitions/v1api.ticketListResponseData'
    type: object
  v1api.ticketListResponseData:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Ticket'
        type: array
      total:
        type: integer
    type: object
