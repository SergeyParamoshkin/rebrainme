# ============================================
# GitLab CI/CD с Kaniko для Golang приложений
# ============================================

stages:
  - test
  - build
  - deploy

variables:
  # Kaniko версии
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.19.0-debug

  # Registry настройки
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# ============================================
# Шаблон для Kaniko сборки
# ============================================
.kaniko-build:
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/${DOCKERFILE}" \
        --destination "${IMAGE_NAME}:${IMAGE_TAG}" \
        --destination "${IMAGE_NAME}:${EXTRA_TAG}" \
        --cache=true \
        --cache-repo="${IMAGE_NAME}/cache" \
        --cache-ttl=168h \
        --cleanup

# ============================================
# Stage 1: Тестирование
# ============================================
test:
  stage: test
  image: golang:1.24-alpine
  before_script:
    - apk add --no-cache git make
  script:
    - go mod download
    - go test -v -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
  only:
    - branches
    - tags

lint:
  stage: test
  image: golangci/golangci-lint:v1.55-alpine
  script:
    - golangci-lint run --timeout=5m ./...
  only:
    - branches
    - tags

# ============================================
# Stage 2: Сборка образов
# ============================================

# Базовый вариант
build-basic:
  extends: .kaniko-build
  stage: build
  variables:
    DOCKERFILE: webinar-materials/dockerfiles/Dockerfile.basic
    EXTRA_TAG: basic-latest
  only:
    - main
    - tags

# Оптимизированный вариант
build-optimized:
  extends: .kaniko-build
  stage: build
  variables:
    DOCKERFILE: webinar-materials/dockerfiles/Dockerfile.optimized
    EXTRA_TAG: optimized-latest
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/${DOCKERFILE}" \
        --destination "${IMAGE_NAME}:${IMAGE_TAG}" \
        --destination "${IMAGE_NAME}:latest" \
        --build-arg VERSION=${CI_COMMIT_TAG:-dev} \
        --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
        --build-arg GIT_COMMIT=${CI_COMMIT_SHORT_SHA} \
        --cache=true \
        --cache-repo="${IMAGE_NAME}/cache" \
        --cleanup
  only:
    - main
    - tags

# Distroless вариант (production)
build-distroless:
  extends: .kaniko-build
  stage: build
  variables:
    DOCKERFILE: webinar-materials/dockerfiles/Dockerfile.distroless
    EXTRA_TAG: distroless-latest
  only:
    - tags

# Scratch вариант (minimal)
build-scratch:
  extends: .kaniko-build
  stage: build
  variables:
    DOCKERFILE: webinar-materials/dockerfiles/Dockerfile.scratch
    EXTRA_TAG: scratch-latest
  only:
    - tags

# ============================================
# Stage 3: Security сканирование
# ============================================
security-scan:
  stage: build
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --exit-code 0 --no-progress "${IMAGE_NAME}:${IMAGE_TAG}"
    - trivy image --exit-code 1 --severity CRITICAL --no-progress "${IMAGE_NAME}:${IMAGE_TAG}"
  dependencies:
    - build-optimized
  only:
    - main
    - tags

# ============================================
# Stage 4: Deploy
# ============================================
deploy-staging:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - kubectl config use-context ${KUBE_CONTEXT_STAGING}
    - kubectl set image deployment/myapp myapp=${IMAGE_NAME}:${IMAGE_TAG}
    - kubectl rollout status deployment/myapp
  environment:
    name: staging
    url: https://staging.example.com
  only:
    - main

deploy-production:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - kubectl config use-context ${KUBE_CONTEXT_PROD}
    - kubectl set image deployment/myapp myapp=${IMAGE_NAME}:${IMAGE_TAG}
    - kubectl rollout status deployment/myapp
  environment:
    name: production
    url: https://example.com
  when: manual
  only:
    - tags

# ============================================
# Альтернативный пример с Kaniko в Kubernetes
# ============================================
build-in-k8s:
  stage: build
  tags:
    - kubernetes
  script:
    - |
      cat <<EOF | kubectl apply -f -
      apiVersion: v1
      kind: Pod
      metadata:
        name: kaniko-build-${CI_COMMIT_SHORT_SHA}
      spec:
        containers:
        - name: kaniko
          image: gcr.io/kaniko-project/executor:latest
          args:
          - "--dockerfile=/workspace/Dockerfile"
          - "--context=git://github.com/user/repo.git#refs/heads/main"
          - "--destination=${IMAGE_NAME}:${IMAGE_TAG}"
          - "--cache=true"
          - "--cache-repo=${IMAGE_NAME}/cache"
          volumeMounts:
          - name: docker-config
            mountPath: /kaniko/.docker/
        restartPolicy: Never
        volumes:
        - name: docker-config
          secret:
            secretName: docker-config
      EOF
    - kubectl wait --for=condition=complete --timeout=600s pod/kaniko-build-${CI_COMMIT_SHORT_SHA}
    - kubectl delete pod kaniko-build-${CI_COMMIT_SHORT_SHA}
  only:
    - branches

# ============================================
# Multi-arch build с Kaniko (experimental)
# ============================================
build-multiarch:
  stage: build
  parallel:
    matrix:
      - ARCH: [amd64, arm64]
  image:
    name: gcr.io/kaniko-project/executor:latest
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --destination "${IMAGE_NAME}:${IMAGE_TAG}-${ARCH}" \
        --custom-platform=linux/${ARCH} \
        --cache=true \
        --cache-repo="${IMAGE_NAME}/cache-${ARCH}"
  only:
    - tags

# Создание multi-arch manifest
create-manifest:
  stage: deploy
  image: mplatform/manifest-tool:alpine
  script:
    - |
      manifest-tool push from-args \
        --platforms linux/amd64,linux/arm64 \
        --template "${IMAGE_NAME}:${IMAGE_TAG}-ARCH" \
        --target "${IMAGE_NAME}:${IMAGE_TAG}"
  dependencies:
    - build-multiarch
  only:
    - tags
