apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          # Liveness Probe (перезапускает контейнер, если Nginx "умер")
          livenessProbe:
            httpGet:
              path: / # Проверяет корневой путь
              port: 80
            initialDelaySeconds: 10 # Даем Nginx 10 секунд на запуск
            periodSeconds: 5 # Проверка каждые 5 секунд
            timeoutSeconds: 2 # Таймаут запроса
            failureThreshold: 3 # 3 ошибки → контейнер перезапустится
          # Readiness Probe (исключает под из балансировки, если Nginx не отвечает)
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 1
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
# Сервис для доступа к Nginx (опционально)
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP # Или LoadBalancer/NodePort для внешнего доступа
